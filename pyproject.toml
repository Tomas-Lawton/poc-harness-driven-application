[tool.ruff]
line-length = 120
src = ["engine"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RET"]
ignore = ["N818"]  # Blocked and NotAllowed appear by name in run logs

[tool.ruff.lint.per-file-ignores]
"engine/steps/*.py" = ["E402"]  # steps put engine/ on the import path first

[tool.ruff.lint.isort]
known-first-party = ["checks", "core", "read"]
force-single-line = true

[tool.pytest.ini_options]
pythonpath = ["engine"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
